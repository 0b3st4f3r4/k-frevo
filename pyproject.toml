[project]
name = "frevolab"
version = "0.1.0"
description = "Livro e laboratorio sobre modelagem e decisao quando a lei muda"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "pandas>=2.2",
    "graphviz>=0.20",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

# A biblioteca vive em lib/ e e instalada em modo editavel: o caderno faz "import
# frevolab" e nada mais. O mapa de pacotes e o que permite manter o diretorio com o
# nome escolhido em vez de adotar o layout src/ convencional.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/frevolab"]
